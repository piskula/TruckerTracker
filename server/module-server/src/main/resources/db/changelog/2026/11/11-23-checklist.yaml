                ('WHEELS_1', '{"sk":"Vizuálna kontrola pneumatík (poškodenie, opotrebenie)"}'::jsonb, 2, '2026-11-24 00:00:00'),
                ('WHEELS_2', '{"sk":"Kontrola tlaku v pneumatikách"}'::jsonb, 3, '2026-11-24 00:00:00'),
                ('WHEELS_3', '{"sk":"Kontrola dotiahnutia kolies"}'::jsonb, 4, '2026-11-24 00:00:00'),
                ('LIGHTS_1', '{"sk":"Kontrola osvetlenia"}'::jsonb, 5, '2026-11-24 00:00:00'),
                ('BODYWORK_1', '{"sk":"Vizuálna kontrola vozidla (škrabance, odreniny, schodíky, úniky kvapalín)"}'::jsonb, 6, '2026-11-24 00:00:00'),
                ('LICENSE_1', '{"sk":"Kontrola dokladov (eurolicencia, osvedčenia, karty)"}'::jsonb, 7, '2026-11-24 00:00:00'),
