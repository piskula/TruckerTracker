name: Build Debug Apps

on:
    push:
        branches:
            - main
        paths-ignore:
            - '**/*.md'
            - '**/*.MD'
            - '.claude/**'
            - 'docs/**'
            - 'server/**'
    pull_request:
        paths-ignore:
            - '**/*.md'
            - '**/*.MD'
            - '.claude/**'
            - 'docs/**'
            - 'server/**'
    workflow_dispatch:

jobs:
    verify:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Set up Gradle build environment
                uses: ./.github/actions/setup-gradle-build

            -   name: Fetch Firebase Android config
                run: |
                    mkdir -p app/app/android/src/staging
                    npx firebase-tools@latest apps:sdkconfig ANDROID "$FIREBASE_STAGING_ANDROID_APP_ID" \
                        --project trucktrack-cf134 \
                        -o app/app/android/src/staging/google-services.json
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_ANDROID_APP_ID: ${{ secrets.FIREBASE_STAGING_ANDROID_APP_ID }}

            -   name: Run detekt and Android Lint
                run: ./gradlew :app:app:android:detekt :app:app:android:lintStagingDebug --continue

            -   name: Upload detekt SARIF report
                if: always()
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: app/app/android/build/reports/detekt/detekt.sarif
                    category: android-detekt

            -   name: Upload Android Lint SARIF report
                if: always()
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: app/app/android/build/reports/lint-results-stagingDebug.sarif
                    category: android-lint

    build-android:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Set up Gradle build environment
                uses: ./.github/actions/setup-gradle-build

            -   name: Fetch Firebase Android configs
                run: |
                    mkdir -p app/app/android/src/staging app/app/android/src/prod
                    npx firebase-tools@latest apps:sdkconfig ANDROID "$FIREBASE_STAGING_ANDROID_APP_ID" \
                        --project trucktrack-cf134 \
                        -o app/app/android/src/staging/google-services.json
                    npx firebase-tools@latest apps:sdkconfig ANDROID "$FIREBASE_PROD_ANDROID_APP_ID" \
                        --project trucktrack-cf134 \
                        -o app/app/android/src/prod/google-services.json
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_ANDROID_APP_ID: ${{ secrets.FIREBASE_STAGING_ANDROID_APP_ID }}
                    FIREBASE_PROD_ANDROID_APP_ID: ${{ secrets.FIREBASE_PROD_ANDROID_APP_ID }}

            -   name: Build staging and prod debug APKs
                run: |
                    ./gradlew :app:app:android:assembleStagingDebug :app:app:android:assembleProdDebug \
                        -PappVersionName=dev.${{ github.run_number }} \
                        -PappVersionCode=1

            -   name: Collect APKs
                run: |
                    mkdir -p dist
                    mv app/app/android/build/outputs/apk/staging/debug/android-staging-debug.apk dist/truck-track-staging.apk
                    mv app/app/android/build/outputs/apk/prod/debug/android-prod-debug.apk dist/truck-track-prod.apk

            -   name: Upload APK artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: android-debug-apks
                    path: dist/*.apk
                    retention-days: 7

    build-ios:
        # Builds real signed .ipas once the iOS signing secrets below are all configured; until
        # then it falls back to unsigned iOS Simulator builds so CI keeps passing. No code
        # changes are needed to flip over — just add the secrets. See docs/KMP_IOS_READINESS.md.
        runs-on: macos-15
        outputs:
            signed: ${{ steps.check-secrets.outputs.configured }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Set up Gradle build environment
                uses: ./.github/actions/setup-gradle-build

            -   name: Select latest Xcode
                uses: maxim-lobanov/setup-xcode@v1
                with:
                    xcode-version: latest-stable

            -   name: Cache CocoaPods
                uses: actions/cache@v6
                with:
                    path: |
                        app/app/ios/Pods
                        ~/Library/Caches/CocoaPods
                    key: cocoapods-${{ hashFiles('app/app/ios/Podfile') }}

            -   name: Install CocoaPods dependencies
                working-directory: app/app/ios
                run: pod install

            -   name: Check iOS signing secrets are configured
                id: check-secrets
                run: |
                    if [ -n "$IOS_TEAM_ID" ] && [ -n "$IOS_CERT_B64" ] && [ -n "$IOS_CERT_PASSWORD" ] && [ -n "$IOS_STAGING_PROFILE_B64" ] && [ -n "$IOS_PROD_PROFILE_B64" ]; then
                        echo "configured=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "::warning::iOS signing secrets are not configured yet — building unsigned Simulator apps instead of signed .ipas. See docs/KMP_IOS_READINESS.md."
                        echo "configured=false" >> "$GITHUB_OUTPUT"
                    fi
                env:
                    IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
                    IOS_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
                    IOS_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
                    IOS_STAGING_PROFILE_B64: ${{ secrets.IOS_STAGING_ADHOC_PROFILE_BASE64 }}
                    IOS_PROD_PROFILE_B64: ${{ secrets.IOS_PROD_ADHOC_PROFILE_BASE64 }}

            -   name: Build iOS Simulator apps (unsigned fallback)
                if: steps.check-secrets.outputs.configured != 'true'
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_IOS_APP_ID: ${{ secrets.FIREBASE_STAGING_IOS_APP_ID }}
                    FIREBASE_PROD_IOS_APP_ID: ${{ secrets.FIREBASE_PROD_IOS_APP_ID }}
                run: |
                    mkdir -p dist
                    build_simulator_app() {
                        rm -f app/app/ios/iosApp/GoogleService-Info.plist
                        npx firebase-tools@latest apps:sdkconfig IOS "$2" \
                            --project trucktrack-cf134 \
                            -o app/app/ios/iosApp/GoogleService-Info.plist
                        xcodebuild \
                            -workspace app/app/ios/iosApp.xcworkspace \
                            -scheme iosApp \
                            -sdk iphonesimulator \
                            -configuration Debug \
                            -destination 'generic/platform=iOS Simulator' \
                            -derivedDataPath build-ios \
                            APP_ENVIRONMENT="$1" \
                            CODE_SIGNING_ALLOWED=NO \
                            build
                        (cd build-ios/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/dist/truck-track-$1-ios-simulator.zip" iosApp.app)
                    }
                    build_simulator_app staging "$FIREBASE_STAGING_IOS_APP_ID"
                    build_simulator_app prod "$FIREBASE_PROD_IOS_APP_ID"

            -   name: Upload Simulator app artifacts
                if: steps.check-secrets.outputs.configured != 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: ios-simulator-apps
                    path: dist/*-ios-simulator.zip
                    retention-days: 7

            -   name: Import signing certificate and provisioning profiles
                if: steps.check-secrets.outputs.configured == 'true'
                env:
                    IOS_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
                    IOS_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
                    IOS_STAGING_PROFILE_B64: ${{ secrets.IOS_STAGING_ADHOC_PROFILE_BASE64 }}
                    IOS_PROD_PROFILE_B64: ${{ secrets.IOS_PROD_ADHOC_PROFILE_BASE64 }}
                run: |
                    KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
                    KEYCHAIN_PASSWORD=$(uuidgen)
                    CERT_PATH="$RUNNER_TEMP/distribution.p12"

                    echo "$IOS_CERT_B64" | base64 -D -o "$CERT_PATH"

                    security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                    security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                    security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                    security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
                    security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
                    security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
                    echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

                    PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
                    mkdir -p "$PROFILE_DIR"

                    install_profile() {
                        local PROFILE_PATH="$RUNNER_TEMP/$1.mobileprovision"
                        local PROFILE_PLIST="$RUNNER_TEMP/$1-profile.plist"
                        echo "$2" | base64 -D -o "$PROFILE_PATH"
                        security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
                        local PROFILE_UUID
                        local PROFILE_NAME
                        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
                        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
                        cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
                        echo "$3=$PROFILE_NAME" >> "$GITHUB_ENV"
                    }
                    install_profile staging "$IOS_STAGING_PROFILE_B64" STAGING_PROFILE_NAME
                    install_profile prod "$IOS_PROD_PROFILE_B64" PROD_PROFILE_NAME

            -   name: Archive signed staging app
                if: steps.check-secrets.outputs.configured == 'true'
                uses: ./.github/actions/archive-ios-app
                with:
                    environment: staging
                    bundle-id: com.momosi.trucktrack.staging
                    firebase-ios-app-id: ${{ secrets.FIREBASE_STAGING_IOS_APP_ID }}
                    firebase-token: ${{ secrets.FIREBASE_TOKEN }}
                    team-id: ${{ secrets.IOS_TEAM_ID }}
                    profile-name: ${{ env.STAGING_PROFILE_NAME }}
                    build-number: ${{ github.run_number }}
                    output-path: dist/truck-track-staging.ipa

            -   name: Archive signed prod app
                if: steps.check-secrets.outputs.configured == 'true'
                uses: ./.github/actions/archive-ios-app
                with:
                    environment: prod
                    bundle-id: com.momosi.trucktrack
                    firebase-ios-app-id: ${{ secrets.FIREBASE_PROD_IOS_APP_ID }}
                    firebase-token: ${{ secrets.FIREBASE_TOKEN }}
                    team-id: ${{ secrets.IOS_TEAM_ID }}
                    profile-name: ${{ env.PROD_PROFILE_NAME }}
                    build-number: ${{ github.run_number }}
                    output-path: dist/truck-track-prod.ipa

            -   name: Upload signed .ipa artifacts
                if: steps.check-secrets.outputs.configured == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: ios-ipas
                    path: dist/*.ipa
                    retention-days: 7

            -   name: Clean up signing keychain
                if: always() && steps.check-secrets.outputs.configured == 'true'
                run: security delete-keychain "$KEYCHAIN_PATH" || true

    publish-release:
        needs: [ verify, build-android, build-ios ]
        if: |
            always() &&
            github.event_name != 'pull_request' &&
            github.ref == 'refs/heads/main' &&
            needs.verify.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Download Android artifacts
                uses: actions/download-artifact@v8
                continue-on-error: true
                with:
                    name: android-debug-apks
                    path: artifacts

            -   name: Download iOS Simulator artifacts
                uses: actions/download-artifact@v8
                continue-on-error: true
                with:
                    name: ios-simulator-apps
                    path: artifacts

            -   name: Download iOS .ipa artifacts
                uses: actions/download-artifact@v8
                continue-on-error: true
                with:
                    name: ios-ipas
                    path: artifacts

            -   name: Collect available assets
                id: assets
                run: |
                    shopt -s nullglob
                    FILES=(artifacts/*.apk artifacts/*.ipa artifacts/*-ios-simulator.zip)

                    if [ ${#FILES[@]} -eq 0 ]; then
                        echo "::error::Both Android and iOS builds failed (or produced no artifact) — nothing to publish"
                        exit 1
                    fi

                    if [ ${#FILES[@]} -lt 4 ]; then
                        echo "::warning::Publishing a partial release — only ${#FILES[@]} of 4 build artifact(s) are available"
                    fi

                    echo "files=${FILES[*]}" >> "$GITHUB_OUTPUT"

            -   name: Delete previous latest release
                run: gh release delete latest --yes --cleanup-tag || true
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}

            -   name: Publish latest pre-release
                run: |
                    gh release create latest ${{ steps.assets.outputs.files }} \
                        --title "Latest Debug Build" \
                        --prerelease \
                        --notes "Automated debug build from main (${{ github.sha }})"
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}

    distribute-android:
        needs: [ verify, build-android ]
        if: |
            github.event_name != 'pull_request' &&
            github.ref == 'refs/heads/main' &&
            needs.verify.result == 'success'
        runs-on: ubuntu-latest

        steps:
            -   name: Download Android artifacts
                uses: actions/download-artifact@v8
                with:
                    name: android-debug-apks
                    path: artifacts

            -   name: Write Firebase release notes
                env:
                    COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
                run: |
                    {
                        echo "$COMMIT_MESSAGE"
                        echo ""
                        echo "Commit: ${{ github.sha }}"
                        echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    } > release-notes.txt

            -   name: Distribute staging APK to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute artifacts/truck-track-staging.apk \
                        --app "$FIREBASE_STAGING_ANDROID_APP_ID" \
                        --groups "internal-testers" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_ANDROID_APP_ID: ${{ secrets.FIREBASE_STAGING_ANDROID_APP_ID }}

            -   name: Distribute prod APK to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute artifacts/truck-track-prod.apk \
                        --app "$FIREBASE_PROD_ANDROID_APP_ID" \
                        --groups "internal-testers" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_PROD_ANDROID_APP_ID: ${{ secrets.FIREBASE_PROD_ANDROID_APP_ID }}

    distribute-ios:
        needs: [ verify, build-ios ]
        if: |
            github.event_name != 'pull_request' &&
            github.ref == 'refs/heads/main' &&
            needs.verify.result == 'success' &&
            needs.build-ios.outputs.signed == 'true'
        runs-on: ubuntu-latest

        steps:
            -   name: Download iOS .ipa artifacts
                uses: actions/download-artifact@v8
                with:
                    name: ios-ipas
                    path: artifacts

            -   name: Write Firebase release notes
                env:
                    COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
                run: |
                    {
                        echo "$COMMIT_MESSAGE"
                        echo ""
                        echo "Commit: ${{ github.sha }}"
                        echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    } > release-notes.txt

            -   name: Distribute staging .ipa to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute artifacts/truck-track-staging.ipa \
                        --app "$FIREBASE_STAGING_IOS_APP_ID" \
                        --groups "internal-testers" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_IOS_APP_ID: ${{ secrets.FIREBASE_STAGING_IOS_APP_ID }}

            -   name: Distribute prod .ipa to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute artifacts/truck-track-prod.ipa \
                        --app "$FIREBASE_PROD_IOS_APP_ID" \
                        --groups "internal-testers" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_PROD_IOS_APP_ID: ${{ secrets.FIREBASE_PROD_IOS_APP_ID }}
