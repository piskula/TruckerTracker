name: Rebase Check

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    rebase-check:
        name: rebase-check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Check that PR is rebased on latest main
              run: |
                  git fetch origin main
                  
                  BASE_SHA=$(git rev-parse origin/main)
                  HEAD_SHA=$(git rev-parse HEAD)
                  
                  echo "main: $BASE_SHA"
                  echo "PR:   $HEAD_SHA"
                  
                  if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
                    echo "::error::This branch is not based on the latest main."
                    echo "::error::Please rebase your branch onto main."
                    exit 1
                  fi
                  
                  if git rev-list --merges "$BASE_SHA..$HEAD_SHA" | grep -q .; then
                    echo "::error::This branch contains merge commits."
                    echo "::error::Please rebase instead of merging main."
                    exit 1
                  fi
                  
                  echo "Branch is correctly rebased on the latest main."
