name: Release App

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version-name: ${{ steps.version.outputs.name }}
            version-code: ${{ steps.version.outputs.code }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Parse version from tag
                id: version
                run: |
                    TAG="${GITHUB_REF_NAME}"
                    if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                        echo "Tag '$TAG' does not match required vMAJOR.MINOR.PATCH format" >&2
                        exit 1
                    fi

                    MAJOR="${BASH_REMATCH[1]}"
                    MINOR="${BASH_REMATCH[2]}"
                    PATCH="${BASH_REMATCH[3]}"

                    if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
                        echo "MINOR and PATCH must be less than 100 to avoid versionCode collisions" >&2
                        exit 1
                    fi

                    VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
                    VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

                    echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
                    echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

            -   name: Generate changelog since previous release
                run: |
                    PREVIOUS_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -B1 -x "${GITHUB_REF_NAME}" | head -1)
                    if [ "$PREVIOUS_TAG" = "${GITHUB_REF_NAME}" ]; then
                        PREVIOUS_TAG=""
                    fi

                    {
                        if [ -n "$PREVIOUS_TAG" ]; then
                            echo "Changes since $PREVIOUS_TAG:"
                            git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}"
                        else
                            echo "Initial release."
                            git log --pretty=format:"- %s" "${GITHUB_REF_NAME}"
                        fi
                        echo ""
                        echo ""
                        echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    } > release-notes.txt

            -   name: Upload release notes
                uses: actions/upload-artifact@v7
                with:
                    name: release-notes
                    path: release-notes.txt
                    retention-days: 7

    build-android:
        needs: [ prepare ]
        runs-on: ubuntu-latest
        env:
            VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
            VERSION_CODE: ${{ needs.prepare.outputs.version-code }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Set up Gradle build environment
                uses: ./.github/actions/setup-gradle-build

            -   name: Fetch Firebase Android configs
                run: |
                    mkdir -p app/app/android/src/staging app/app/android/src/prod
                    npx firebase-tools@latest apps:sdkconfig ANDROID "$FIREBASE_STAGING_ANDROID_APP_ID" \
                        --project trucktrack-cf134 \
                        -o app/app/android/src/staging/google-services.json
                    npx firebase-tools@latest apps:sdkconfig ANDROID "$FIREBASE_PROD_ANDROID_APP_ID" \
                        --project trucktrack-cf134 \
                        -o app/app/android/src/prod/google-services.json
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_ANDROID_APP_ID: ${{ secrets.FIREBASE_STAGING_ANDROID_APP_ID }}
                    FIREBASE_PROD_ANDROID_APP_ID: ${{ secrets.FIREBASE_PROD_ANDROID_APP_ID }}

            -   name: Decode release keystore
                run: |
                    KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
                    echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
                    echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
                env:
                    ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

            -   name: Build staging and prod release APKs and AABs
                run: |
                    ./gradlew \
                        :app:app:android:assembleStagingRelease :app:app:android:bundleStagingRelease \
                        :app:app:android:assembleProdRelease :app:app:android:bundleProdRelease \
                        -PappVersionName="$VERSION_NAME" \
                        -PappVersionCode="$VERSION_CODE" \
                        -PandroidKeystoreFile="$KEYSTORE_PATH" \
                        -PandroidKeystorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                        -PandroidKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
                        -PandroidKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"

            -   name: Remove decoded keystore
                if: always()
                run: rm -f "$KEYSTORE_PATH"

            -   name: Collect APKs and AABs
                run: |
                    OUTPUTS=app/app/android/build/outputs
                    mkdir -p dist
                    for ENVIRONMENT in staging prod; do
                        mv "$OUTPUTS/apk/$ENVIRONMENT/release/android-$ENVIRONMENT-release.apk" "dist/truck-track-$ENVIRONMENT-$VERSION_NAME.apk"
                        mv "$OUTPUTS/bundle/${ENVIRONMENT}Release/android-$ENVIRONMENT-release.aab" "dist/truck-track-$ENVIRONMENT-$VERSION_NAME.aab"
                    done

            -   name: Upload Android release artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: android-release
                    path: |
                        dist/*.apk
                        dist/*.aab
                    retention-days: 7

            -   name: Upload prod R8 mapping file
                uses: actions/upload-artifact@v7
                with:
                    name: android-prod-mapping
                    path: app/app/android/build/outputs/mapping/prodRelease/mapping.txt
                    if-no-files-found: error
                    retention-days: 7

    build-ios:
        needs: [ prepare ]
        runs-on: macos-15
        outputs:
            signed: ${{ steps.check-secrets.outputs.configured }}
            app-store: ${{ steps.check-secrets.outputs.app-store }}
        env:
            VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
            VERSION_CODE: ${{ needs.prepare.outputs.version-code }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v7

            -   name: Set up Gradle build environment
                uses: ./.github/actions/setup-gradle-build

            -   name: Select latest Xcode
                uses: maxim-lobanov/setup-xcode@v1
                with:
                    xcode-version: latest-stable

            -   name: Check iOS signing secrets are configured
                id: check-secrets
                run: |
                    if [ -n "$IOS_TEAM_ID" ] && [ -n "$IOS_CERT_B64" ] && [ -n "$IOS_CERT_PASSWORD" ] && [ -n "$IOS_STAGING_PROFILE_B64" ] && [ -n "$IOS_PROD_PROFILE_B64" ]; then
                        echo "configured=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "::warning::iOS signing secrets are not configured yet — skipping the iOS release build. See docs/KMP_IOS_READINESS.md."
                        echo "configured=false" >> "$GITHUB_OUTPUT"
                    fi

                    if [ -n "$IOS_PROD_APPSTORE_PROFILE_B64" ] && [ -n "$ASC_KEY_B64" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
                        echo "app-store=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "::warning::App Store Connect secrets are not configured — skipping the TestFlight upload."
                        echo "app-store=false" >> "$GITHUB_OUTPUT"
                    fi
                env:
                    IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
                    IOS_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
                    IOS_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
                    IOS_STAGING_PROFILE_B64: ${{ secrets.IOS_STAGING_ADHOC_PROFILE_BASE64 }}
                    IOS_PROD_PROFILE_B64: ${{ secrets.IOS_PROD_ADHOC_PROFILE_BASE64 }}
                    IOS_PROD_APPSTORE_PROFILE_B64: ${{ secrets.IOS_PROD_APPSTORE_PROFILE_BASE64 }}
                    ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
                    ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                    ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

            -   name: Cache CocoaPods
                if: steps.check-secrets.outputs.configured == 'true'
                uses: actions/cache@v6
                with:
                    path: |
                        app/app/ios/Pods
                        ~/Library/Caches/CocoaPods
                    key: cocoapods-${{ hashFiles('app/app/ios/Podfile') }}

            -   name: Install CocoaPods dependencies
                if: steps.check-secrets.outputs.configured == 'true'
                working-directory: app/app/ios
                run: pod install

            -   name: Import signing certificate and provisioning profiles
                if: steps.check-secrets.outputs.configured == 'true'
                env:
                    IOS_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
                    IOS_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
                    IOS_STAGING_PROFILE_B64: ${{ secrets.IOS_STAGING_ADHOC_PROFILE_BASE64 }}
                    IOS_PROD_PROFILE_B64: ${{ secrets.IOS_PROD_ADHOC_PROFILE_BASE64 }}
                    IOS_PROD_APPSTORE_PROFILE_B64: ${{ secrets.IOS_PROD_APPSTORE_PROFILE_BASE64 }}
                    INSTALL_APP_STORE_PROFILE: ${{ steps.check-secrets.outputs.app-store }}
                run: |
                    KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
                    KEYCHAIN_PASSWORD=$(uuidgen)
                    CERT_PATH="$RUNNER_TEMP/distribution.p12"

                    echo "$IOS_CERT_B64" | base64 -D -o "$CERT_PATH"

                    security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                    security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                    security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                    security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
                    security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
                    security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
                    echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

                    PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
                    mkdir -p "$PROFILE_DIR"

                    install_profile() {
                        local PROFILE_PATH="$RUNNER_TEMP/$1.mobileprovision"
                        local PROFILE_PLIST="$RUNNER_TEMP/$1-profile.plist"
                        echo "$2" | base64 -D -o "$PROFILE_PATH"
                        security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
                        local PROFILE_UUID
                        local PROFILE_NAME
                        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
                        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
                        cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
                        echo "$3=$PROFILE_NAME" >> "$GITHUB_ENV"
                    }
                    install_profile staging "$IOS_STAGING_PROFILE_B64" STAGING_PROFILE_NAME
                    install_profile prod "$IOS_PROD_PROFILE_B64" PROD_PROFILE_NAME
                    if [ "$INSTALL_APP_STORE_PROFILE" = "true" ]; then
                        install_profile prod-appstore "$IOS_PROD_APPSTORE_PROFILE_B64" PROD_APPSTORE_PROFILE_NAME
                    fi

            -   name: Archive signed staging release
                if: steps.check-secrets.outputs.configured == 'true'
                uses: ./.github/actions/archive-ios-app
                with:
                    environment: staging
                    bundle-id: com.momosi.trucktrack.staging
                    firebase-ios-app-id: ${{ secrets.FIREBASE_STAGING_IOS_APP_ID }}
                    firebase-token: ${{ secrets.FIREBASE_TOKEN }}
                    team-id: ${{ secrets.IOS_TEAM_ID }}
                    profile-name: ${{ env.STAGING_PROFILE_NAME }}
                    configuration: Release
                    marketing-version: ${{ env.VERSION_NAME }}
                    build-number: ${{ env.VERSION_CODE }}
                    output-path: dist/truck-track-staging-${{ env.VERSION_NAME }}.ipa

            -   name: Archive signed prod release
                if: steps.check-secrets.outputs.configured == 'true'
                uses: ./.github/actions/archive-ios-app
                with:
                    environment: prod
                    bundle-id: com.momosi.trucktrack
                    firebase-ios-app-id: ${{ secrets.FIREBASE_PROD_IOS_APP_ID }}
                    firebase-token: ${{ secrets.FIREBASE_TOKEN }}
                    team-id: ${{ secrets.IOS_TEAM_ID }}
                    profile-name: ${{ env.PROD_PROFILE_NAME }}
                    configuration: Release
                    marketing-version: ${{ env.VERSION_NAME }}
                    build-number: ${{ env.VERSION_CODE }}
                    output-path: dist/truck-track-prod-${{ env.VERSION_NAME }}.ipa
                    app-store-profile-name: ${{ env.PROD_APPSTORE_PROFILE_NAME }}
                    app-store-output-path: dist-appstore/truck-track-prod-${{ env.VERSION_NAME }}.ipa

            -   name: Upload iOS release artifacts
                if: steps.check-secrets.outputs.configured == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: ios-release
                    path: dist/*.ipa
                    retention-days: 7

            -   name: Upload iOS App Store artifact
                if: steps.check-secrets.outputs.configured == 'true' && steps.check-secrets.outputs.app-store == 'true'
                uses: actions/upload-artifact@v7
                with:
                    name: ios-appstore
                    path: dist-appstore/*.ipa
                    retention-days: 7

            -   name: Clean up signing keychain
                if: always() && steps.check-secrets.outputs.configured == 'true'
                run: security delete-keychain "$KEYCHAIN_PATH" || true

    publish-release:
        needs: [ prepare, build-android, build-ios ]
        if: always() && needs.prepare.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Download release notes
                uses: actions/download-artifact@v8
                with:
                    name: release-notes

            -   name: Download Android release artifacts
                uses: actions/download-artifact@v8
                continue-on-error: true
                with:
                    name: android-release
                    path: artifacts

            -   name: Download iOS release artifacts
                uses: actions/download-artifact@v8
                continue-on-error: true
                with:
                    name: ios-release
                    path: artifacts

            -   name: Collect available assets
                id: assets
                run: |
                    shopt -s nullglob
                    ANDROID_FILES=(artifacts/*.apk artifacts/*.aab)
                    IOS_FILES=(artifacts/*.ipa)

                    if [ ${#ANDROID_FILES[@]} -ne 4 ]; then
                        echo "::error::Expected 4 Android release artifacts (staging + prod APK/AAB), found ${#ANDROID_FILES[@]} — not publishing"
                        exit 1
                    fi

                    if [ ${#IOS_FILES[@]} -ne 2 ]; then
                        echo "::warning::Publishing without a complete iOS release — found ${#IOS_FILES[@]} of 2 .ipa file(s)"
                    fi

                    echo "files=${ANDROID_FILES[*]} ${IOS_FILES[*]}" >> "$GITHUB_OUTPUT"

            -   name: Publish GitHub Release
                run: |
                    gh release create "${GITHUB_REF_NAME}" ${{ steps.assets.outputs.files }} \
                        --title "${GITHUB_REF_NAME}" \
                        --notes-file release-notes.txt
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}

    distribute-android:
        needs: [ prepare, publish-release ]
        runs-on: ubuntu-latest
        env:
            VERSION_NAME: ${{ needs.prepare.outputs.version-name }}

        steps:
            -   name: Download release notes
                uses: actions/download-artifact@v8
                with:
                    name: release-notes

            -   name: Download Android release artifacts
                uses: actions/download-artifact@v8
                with:
                    name: android-release
                    path: artifacts

            -   name: Distribute staging APK to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute "artifacts/truck-track-staging-$VERSION_NAME.apk" \
                        --app "$FIREBASE_STAGING_ANDROID_APP_ID" \
                        --groups "release" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_ANDROID_APP_ID: ${{ secrets.FIREBASE_STAGING_ANDROID_APP_ID }}

            -   name: Distribute prod APK to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute "artifacts/truck-track-prod-$VERSION_NAME.apk" \
                        --app "$FIREBASE_PROD_ANDROID_APP_ID" \
                        --groups "release" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_PROD_ANDROID_APP_ID: ${{ secrets.FIREBASE_PROD_ANDROID_APP_ID }}

    distribute-ios:
        needs: [ prepare, build-ios, publish-release ]
        if: needs.build-ios.outputs.signed == 'true'
        runs-on: ubuntu-latest
        env:
            VERSION_NAME: ${{ needs.prepare.outputs.version-name }}

        steps:
            -   name: Download release notes
                uses: actions/download-artifact@v8
                with:
                    name: release-notes

            -   name: Download iOS release artifacts
                uses: actions/download-artifact@v8
                with:
                    name: ios-release
                    path: artifacts

            -   name: Distribute staging .ipa to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute "artifacts/truck-track-staging-$VERSION_NAME.ipa" \
                        --app "$FIREBASE_STAGING_IOS_APP_ID" \
                        --groups "release" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_STAGING_IOS_APP_ID: ${{ secrets.FIREBASE_STAGING_IOS_APP_ID }}

            -   name: Distribute prod .ipa to Firebase App Distribution
                run: |
                    npx firebase-tools@latest appdistribution:distribute "artifacts/truck-track-prod-$VERSION_NAME.ipa" \
                        --app "$FIREBASE_PROD_IOS_APP_ID" \
                        --groups "release" \
                        --release-notes-file release-notes.txt
                env:
                    FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
                    FIREBASE_PROD_IOS_APP_ID: ${{ secrets.FIREBASE_PROD_IOS_APP_ID }}

    upload-google-play:
        needs: [ prepare, publish-release ]
        runs-on: ubuntu-latest
        env:
            VERSION_NAME: ${{ needs.prepare.outputs.version-name }}

        steps:
            -   name: Check Google Play secrets are configured
                id: check-secrets
                run: |
                    if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
                        echo "configured=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not configured — skipping the Google Play upload."
                        echo "configured=false" >> "$GITHUB_OUTPUT"
                    fi
                env:
                    PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

            -   name: Download release notes
                if: steps.check-secrets.outputs.configured == 'true'
                uses: actions/download-artifact@v8
                with:
                    name: release-notes

            -   name: Download Android release artifacts
                if: steps.check-secrets.outputs.configured == 'true'
                uses: actions/download-artifact@v8
                with:
                    name: android-release
                    path: artifacts

            -   name: Download prod R8 mapping file
                if: steps.check-secrets.outputs.configured == 'true'
                uses: actions/download-artifact@v8
                with:
                    name: android-prod-mapping
                    path: mapping

            -   name: Prepare Play release notes
                if: steps.check-secrets.outputs.configured == 'true'
                run: |
                    mkdir -p whatsnew
                    grep -v '^Workflow run:' release-notes.txt | head -c 500 > whatsnew/whatsnew-en-US

            -   name: Upload prod AAB to Google Play internal track
                if: steps.check-secrets.outputs.configured == 'true'
                uses: r0adkll/upload-google-play@v1.1.5
                with:
                    serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
                    packageName: com.momosi.trucktrack
                    releaseFiles: artifacts/truck-track-prod-${{ env.VERSION_NAME }}.aab
                    releaseName: ${{ env.VERSION_NAME }}
                    track: internal
                    status: completed
                    whatsNewDirectory: whatsnew
                    mappingFile: mapping/mapping.txt

    upload-testflight:
        needs: [ prepare, build-ios, publish-release ]
        if: needs.build-ios.outputs.signed == 'true' && needs.build-ios.outputs.app-store == 'true'
        runs-on: macos-15
        env:
            VERSION_NAME: ${{ needs.prepare.outputs.version-name }}

        steps:
            -   name: Download iOS App Store artifact
                uses: actions/download-artifact@v8
                with:
                    name: ios-appstore
                    path: artifacts

            -   name: Install App Store Connect API key
                env:
                    ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
                    ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                run: |
                    KEY_DIR="$HOME/.appstoreconnect/private_keys"
                    mkdir -p "$KEY_DIR"
                    echo "$ASC_KEY_B64" | base64 -D -o "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"

            -   name: Upload prod .ipa to TestFlight
                env:
                    ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                    ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                run: |
                    xcrun altool --upload-app \
                        --type ios \
                        --file "artifacts/truck-track-prod-$VERSION_NAME.ipa" \
                        --apiKey "$ASC_KEY_ID" \
                        --apiIssuer "$ASC_ISSUER_ID"

            -   name: Remove App Store Connect API key
                if: always()
                run: rm -rf "$HOME/.appstoreconnect/private_keys"
